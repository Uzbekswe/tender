{% extends "base.html" %}
{% block title %}{{ t('account.signup.title') }}{% endblock %}
{% block content %}
<style>
  .login-card { max-width: 420px; display: grid; gap: 0.7rem; }
  .login-card label { display: flex; flex-direction: column; gap: 0.25rem; }
  .login-card input { width: 100%; }
</style>
<h1>{{ t('account.signup.title') }}</h1>
<p class="muted">{{ t('account.signup.lead') }}</p>
{% if error %}<div class="alert alert-error" role="alert">{{ error }}</div>{% endif %}
<form method="post" action="/signup" class="card login-card">
  <input type="hidden" name="next" value="{{ next_value }}">
  <label>{{ t('account.email') }}
    <input type="email" name="email" value="{{ email }}" required autocomplete="email" autocapitalize="none" autofocus>
  </label>
  <label>{{ t('login.password') }}
    <input type="password" name="password" required minlength="8" autocomplete="new-password">
  </label>
  <label>{{ t('account.password_repeat') }}
    <input type="password" name="password_repeat" required minlength="8" autocomplete="new-password">
  </label>
  {% if invite_required %}
  <label>{{ t('account.invite') }}
    <input type="text" name="invite_code" required autocomplete="off" autocapitalize="none">
    <span class="muted small">{{ t('account.invite.hint') }}</span>
  </label>
  {% endif %}
  <div class="actions">
    <button type="submit" class="btn primary">{{ t('account.signup.submit') }}</button>
  </div>
</form>
<p class="muted small"><a href="/login?next={{ next_value|urlencode }}">{{ t('account.signup.have') }}</a></p>
{% endblock %}
